[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agenthub"
version = "0.1.0"
description = "Lightweight self-hosted coordination and knowledge service for AI agents"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.135.1",
  "starlette==0.49.1",
  "sse-starlette==3.5.1",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy==2.0.41",
  "greenlet==3.2.3",
  "aiosqlite==0.21.0",
  "alembic==1.16.1",
  "pydantic==2.14.3",
  "mcp==1.30.0",
  "argon2-cffi==25.1.0",
  "httpx==0.28.1",
  "PyJWT[crypto]==2.10.1",
  "python-multipart==0.0.33",
  "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "pytest-asyncio==1.0.0",
  "ruff==0.12.2",
  "jsonschema==4.24.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
